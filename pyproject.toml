[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowflake-intent-radar"
version = "1.0.0"
description = "Sub-24h Social Buyer-Intent Scanner via 64-Bit Snowflake ID Math (LinkedIn & X)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Andrew Anderson", email = "andrew@cult.rent" }
]
keywords = ["snowflake-id", "buyer-intent", "linkedin-scraper", "social-selling", "b2b-lead-generation", "ai-agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://www.bridgingtheaigap.com"
Repository = "https://github.com/andrew4522-cr/snowflake-intent-radar"

[project.scripts]
snowflake-intent-radar = "snowflake_intent_radar.radar:main"
